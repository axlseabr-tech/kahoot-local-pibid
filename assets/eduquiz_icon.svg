<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#381273"/>
      <stop offset="50%" stop-color="#22084b"/>
      <stop offset="100%" stop-color="#0f0224"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- As 4 Formas Geométricas Gamificadas em Neon (Triângulo, Losango, Círculo, Quadrado) -->
  <g transform="translate(145, 145)" filter="url(#glow)">
    <polygon points="0,-42 -38,30 38,30" fill="#e21b3c"/>
    <polygon points="0,-36 -32,25 32,25" fill="#ff4d6d"/>
  </g>

  <g transform="translate(367, 145)" filter="url(#glow)">
    <polygon points="0,-42 38,0 0,42 -38,0" fill="#1368ce"/>
    <polygon points="0,-34 32,0 0,34 -32,0" fill="#38bdf8"/>
  </g>

  <g transform="translate(145, 345)" filter="url(#glow)">
    <circle cx="0" cy="0" r="38" fill="#d89e00"/>
    <circle cx="0" cy="0" r="30" fill="#fde047"/>
  </g>

  <g transform="translate(367, 345)" filter="url(#glow)">
    <rect x="-34" y="-34" width="68" height="68" rx="14" fill="#26890c"/>
    <rect x="-28" y="-28" width="56" height="56" rx="10" fill="#4ade80"/>
  </g>

  <circle cx="256" cy="245" r="54" fill="rgba(255,255,255,0.1)" stroke="url(#goldGrad)" stroke-width="8"/>
  <path d="M 256,195 L 235,248 L 262,248 L 245,295 L 285,238 L 258,238 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <text x="256" y="455" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">EDUQUIZ</text>
</svg>
